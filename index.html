<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chart Wall</title>
<style>
  :root { --bg:#0d0f14; --panel:#151922; --line:#232938; --text:#c9d1e0; --accent:#2962ff; --err:#ff6b6b; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:13px/1.5 "Segoe UI","Yu Gothic UI",system-ui,sans-serif; }
  body { display:flex; flex-direction:column; }
  button, select, input, textarea { font:inherit; color:var(--text); background:var(--bg);
                                    border:1px solid var(--line); border-radius:4px; padding:3px 8px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  header { display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:6px 10px; border-bottom:1px solid var(--line); }
  header .hint { opacity:.55; }
  #solo { margin-left:auto; display:flex; flex-wrap:wrap; gap:4px; }
  #solo button { min-width:2.2em; font:700 13px Consolas,monospace; }
  header button.on { color:#fff; background:var(--accent); border-color:var(--accent); }
  #back:disabled { opacity:.4; cursor:default; border-color:var(--line); }

  /* レイアウト編集パネル */
  #panel { display:flex; flex-wrap:wrap; gap:28px; max-height:45vh; overflow:auto; padding:10px 12px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  #panel[hidden] { display:none; }
  #panel h2 { margin:0 0 6px; font-size:13px; }
  #layout { display:block; width:18em; min-height:8em; margin:6px 0; resize:vertical;
            font:18px/1.35 Consolas,monospace; letter-spacing:.35em; }
  #err { color:var(--err); }
  .note { margin:6px 0 0; max-width:22em; opacity:.6; }
  .tiles-wrap { flex:1; min-width:300px; }
  .tiles-wrap .note { max-width:none; margin:0 0 8px; }
  #tiles { column-width:560px; column-gap:24px; }
  .trow { display:grid; grid-template-columns:1.6em 6.5em minmax(8em,1fr) 5.5em 7.5em; gap:6px; align-items:center;
          margin-bottom:8px; break-inside:avoid; }
  .trow b { font:700 15px Consolas,monospace; text-align:center; }
  .trow.media input { grid-column:3 / -1; }
  .trow .media-note, .trow > label { grid-column:2 / -1; }
  .media-note { margin:0; opacity:.65; }
  .add-tabs { display:grid; gap:6px; margin-top:14px; }
  .add-tabs label { display:flex; align-items:center; gap:6px; }
  .trow details { grid-column:2 / -1; }
  .trow summary { cursor:pointer; opacity:.8; }
  .trow details div { display:flex; flex-wrap:wrap; gap:4px 14px; padding:4px 0 2px; }
  .trow label { display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .trow input[type=checkbox] { margin:0; padding:0; accent-color:var(--accent); }

  /* タイルは個別の境界位置で配置 */
  #wall { --gap:6px; flex:1; min-height:0; display:grid; grid-template: minmax(0,1fr) / minmax(0,1fr); padding:4px; }
  #canvas { position:relative; grid-area:1 / 1; min-width:0; min-height:0; }
  .tile { position:absolute; min-width:0; min-height:0; overflow:hidden; background:var(--panel); border:1px solid var(--line); }
  .tile > .tradingview-widget-container { width:100%; height:100%; }
  .tradingview-widget-container__widget { height:100%; }
  .tile iframe { width:100%; height:100%; border:0; display:block; }
  .off { display:grid; place-content:center; gap:14px; padding:16px; text-align:center; background:#000 center/cover no-repeat; }
  .off p { margin:0; text-shadow:0 1px 3px #000; }
  .off button { justify-self:center; font-size:15px; color:#fff; background:var(--accent); border:0; border-radius:6px; padding:10px 22px; }
  .off button:hover { filter:brightness(1.15); }
  /* 1枚だけ大きく表示: 他は隠すだけ（DOMを動かすとiframeが再読込されるため） */
  #wall.solo .tile:not(.max), #wall.solo .split { visibility:hidden; }
  #wall .tile.max { left:0 !important; right:0 !important; top:0 !important; bottom:0 !important; margin:0; z-index:2; }
  body.editing .tile::after { content:attr(data-id); position:absolute; inset:0; display:grid; place-items:center;
                              font:700 64px/1 Consolas,monospace; color:#fff; background:#000a; pointer-events:none; }

  /* 境界線（タブの間のすき間に置くつまみ） */
  .split { position:absolute; z-index:1; touch-action:none; border-radius:3px; }
  .split.x { width:var(--gap); transform:translateX(-50%); cursor:col-resize; }
  .split.y { height:var(--gap); transform:translateY(-50%); cursor:row-resize; }
  .split:hover, .split.on { background:var(--accent); }
  body.dragging { user-select:none; }
  body.dragging iframe { pointer-events:none; } /* ドラッグ中にiframeがマウスを奪うのを防ぐ */
</style>
</head>
<body>
<header>
  <button id="edit" type="button">⚙ レイアウト編集</button>
  <button id="reset" type="button">サイズを均等に戻す</button>
  <span class="hint">境界ドラッグ＝隣接タイルだけ調整 / Shift+ドラッグ＝行・列全体（保存されます）</span>
  <nav id="solo" aria-label="1枚だけ大きく表示"></nav>
  <button id="back" type="button" disabled>⊞ 全体に戻る</button>
</header>
<section id="panel" hidden>
  <div>
    <h2>配置</h2>
    <select id="preset"><option>プリセットから選ぶ…</option></select>
    <textarea id="layout" spellcheck="false" autocomplete="off"></textarea>
    <button id="apply" type="button">適用</button> <span id="err" role="alert"></span>
    <p class="note">1文字＝1タブ。同じ文字を長方形に並べると、そのぶん大きいタブになります。「.」は空きマス。</p>
    <div class="add-tabs">
      <h2>縦長タブを任意追加</h2>
      <label>高さ <select id="add-anchor" aria-label="追加タブの高さ"></select></label>
      <button id="add-chat" type="button">YouTubeコメント欄を追加</button>
    </div>
  </div>
  <div class="tiles-wrap">
    <h2>各タブの中身</h2>
    <p class="note">チャートの中で変えた銘柄・足・インジケーター・描画は保存されません。ここで設定したものが保存されます。</p>
    <div id="tiles"></div>
  </div>
</section>
<main id="wall"><div id="canvas"></div></main>

<script>
// ===== 設定（画面の「レイアウト編集」からも変えられます） =====
const YOUTUBE = ["https://www.youtube.com/watch?v=jfKfPfyJRdk"]; // YouTubeタブの初期URL
const INTERVAL = "15"; // 新しく作ったチャートの足: "1","5","15","60","240","D","W"
const SYMBOLS = [      // 新しく作ったチャートタブに、まだ使っていないものから順に割り当て
  "FX:USDJPY", "FX:EURJPY", "FX:GBPJPY", "FX:AUDJPY",
  "FX:EURUSD", "FX:GBPUSD", "OANDA:XAUUSD", "OANDA:JP225USD",
  "FOREXCOM:SPXUSD", "FOREXCOM:NSXUSD", "BITSTAMP:BTCUSD", "TVC:US10Y",
  "FX:AUDUSD", "FX:NZDJPY", "OANDA:XAGUSD", "BITSTAMP:ETHUSD",
];
const DEFAULT_LAYOUT = "AABC\nAADE\nFGHI";
const DEFAULT_TILES = {
  A: { type: "yt", src: YOUTUBE[0] },
  B: { type: "chart", src: "PEPPERSTONE:USDX", style: "2", volume: false },
  C: { type: "chart", src: "PEPPERSTONE:JPYX", style: "2", volume: false },
  D: { type: "chart", src: "PEPPERSTONE:EURX", style: "2", volume: false },
};
const LEGACY_DEFAULTS = { B: "FX:USDJPY", C: "FX:EURJPY", D: "FX:GBPJPY" };
// ==============================================================

const MIN = 80, KEY = "chart-wall-v2";
const TILE_TYPES = [["chart", "チャート"], ["yt", "YouTube"], ["chat", "YouTubeコメント"]];
// チャートごとに選べる項目（[TradingViewに渡す値, 表示名]）
const INTERVALS = [["1", "1分"], ["3", "3分"], ["5", "5分"], ["15", "15分"], ["30", "30分"], ["60", "1時間"],
                   ["120", "2時間"], ["180", "3時間"], ["240", "4時間"], ["D", "日足"], ["W", "週足"]];
const STYLES = [["1", "ローソク足"], ["9", "中空ローソク"], ["8", "平均足"], ["0", "バー"], ["2", "ライン"], ["3", "エリア"]];
const STUDIES = [["STD;SMA", "単純移動平均"], ["STD;EMA", "指数移動平均"], ["STD;Bollinger_Bands", "ボリンジャーバンド"],
                 ["STD;Ichimoku%1Cloud", "一目均衡表"], ["STD;VWAP", "VWAP"], ["STD;RSI", "RSI"], ["STD;MACD", "MACD"],
                 ["STD;Stochastic", "ストキャスティクス"], ["STD;Average_True_Range", "ATR"]];
const $ = id => document.getElementById(id);
const el = (tag, cls) => Object.assign(document.createElement(tag), cls ? { className: cls } : {});
const wall = $("wall");
const canvas = $("canvas");

// --- 配置テキストの解析: "AAB\nAAC\nDEF" → 各文字の範囲。長方形でなければエラー ---
function parseLayout(text) {
  const grid = text.trim().split(/\r?\n/).map(l => [...l.replace(/\s/g, "")]).filter(r => r.length);
  if (!grid.length) throw new Error("配置が空です");
  if (grid.some(r => r.length !== grid[0].length)) throw new Error("各行の文字数をそろえてください");
  const boxes = {};
  grid.forEach((row, r) => row.forEach((ch, c) => {
    if (ch === ".") return;
    const b = boxes[ch] ??= { r0: r, r1: r, c0: c, c1: c };
    b.r0 = Math.min(b.r0, r); b.r1 = Math.max(b.r1, r);
    b.c0 = Math.min(b.c0, c); b.c1 = Math.max(b.c1, c);
  }));
  for (const [ch, b] of Object.entries(boxes))
    for (let r = b.r0; r <= b.r1; r++)
      for (let c = b.c0; c <= b.c1; c++)
        if (grid[r][c] !== ch) throw new Error(`「${ch}」が長方形になっていません`);
  return { grid, boxes };
}
// プリセット（列を細かく割ると境界線の動かせる幅が狭くなるので、列は少なめにしている）
const PRESETS = [
  ["4枚", "AB\nCD"],
  ["6枚", "ABC\nDEF"],
  ["8枚", "ABCD\nEFGH"],
  ["10枚", "ABCDE\nFGHIJ"],
  ["12枚", "ABCD\nEFGH\nIJKL"],
  ["14枚", "ABCD\nEFGH\nIJKL\nMMNN"],
  ["16枚", "ABCD\nEFGH\nIJKL\nMNOP"],
  ["大1＋5枚", "AAB\nAAC\nDEF"],
  ["大1＋8枚", "AABC\nAADE\nFGHI"],
];
// ドラッグ後の手前側の大きさ(px)。両側とも MIN 以上を保つ
const dragSplit = (pa, pb, d) => { const m = Math.min(MIN, (pa + pb) / 2); return Math.min(Math.max(pa + d, m), pa + pb - m); };

// --- 保存された状態 ---
let st = null;
try { st = JSON.parse(localStorage.getItem(KEY)); } catch {}
if (!st || typeof st !== "object") st = {};
try { parseLayout(st.layout); } catch { st.layout = DEFAULT_LAYOUT; }
if (!st.tiles || typeof st.tiles !== "object" || Array.isArray(st.tiles)) st.tiles = {};
delete st.sideTilesEqualized;
if (st.layout === DEFAULT_LAYOUT) for (const [id, symbol] of Object.entries(LEGACY_DEFAULTS)) {
  const t = st.tiles[id];
  if (t?.type === "chart" && t.src === symbol && !["interval", "style", "studies", "volume"].some(k => Object.prototype.hasOwnProperty.call(t, k)))
    st.tiles[id] = { ...DEFAULT_TILES[id] };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };
const okArr = (a, len) => Array.isArray(a) && a.length === len && a.every(w => Number.isFinite(w) && w > 0);

let cur, tileEls = {}, splitEls = [];
const freeSymbol = () => {
  const used = new Set(Object.keys(cur.boxes).map(id => st.tiles[id]?.src));
  return SYMBOLS.find(s => !used.has(s)) ?? SYMBOLS[0];
};
// タブ（文字）ごとの中身。初めて見る文字なら、最初の1枚はYouTube・以降はチャート
function tileCfg(id) {
  const t = st.tiles[id];
  if (t && TILE_TYPES.some(([type]) => type === t.type) && typeof t.src === "string") return t;
  if (DEFAULT_TILES[id]) return st.tiles[id] = { ...DEFAULT_TILES[id] };
  const first = !Object.keys(st.tiles).length;
  return st.tiles[id] = first && YOUTUBE[0] ? { type: "yt", src: YOUTUBE[0] } : { type: "chart", src: freeSymbol() };
}

// 保存値をそのまま信用せず、選べる値だけに絞る（古い保存データは既定値になる）
const has = (list, v) => list.some(([k]) => k === v);
const chartOpts = t => ({
  interval: has(INTERVALS, t.interval) ? t.interval : INTERVAL,
  style: has(STYLES, t.style) ? t.style : "1",
  studies: Array.isArray(t.studies) ? t.studies.filter(id => has(STUDIES, id)) : [],
  volume: t.volume !== false,
});

// --- YouTube ---
function parseYT(u) {
  if (typeof u !== "string" || !u.trim()) return null;
  u = u.trim();
  let ch = /^UC[\w-]{22}$/.test(u) ? u : null, vid = /^[\w-]{11}$/.test(u) ? u : null;
  if (!ch && !vid) {
    let url;
    try { url = new URL(/^https?:\/\//i.test(u) ? u : "https://" + u); } catch { return null; }
    if (!["https:", "http:"].includes(url.protocol) || url.username || url.password || url.port) return null;
    const host = url.hostname.toLowerCase().replace(/^(www\.|m\.|music\.)/, ""), path = url.pathname.split("/").filter(Boolean);
    if (host === "youtu.be") vid = path[0];
    else if (host === "youtube.com") {
      if (path[0] === "channel") ch = path[1];
      else vid = url.searchParams.get("v") || (["live", "embed", "shorts"].includes(path[0]) ? path[1] : null);
    } else return null;
  }
  if (ch ? !/^UC[\w-]{22}$/.test(ch) : !/^[\w-]{11}$/.test(vid ?? "")) return null;
  return {
    vid: ch ? null : vid, channel: ch,
    embed: ch ? `https://www.youtube.com/embed/live_stream?channel=${ch}&autoplay=1&mute=1&enablejsapi=1`
              : `https://www.youtube.com/embed/${encodeURIComponent(vid)}?autoplay=1&mute=1&enablejsapi=1`,
    watch: ch ? `https://www.youtube.com/channel/${ch}/live` : `https://www.youtube.com/watch?v=${vid}`,
    thumb: vid ? `https://i.ytimg.com/vi/${vid}/hqdefault.jpg` : "",
  };
}
function liveCorrection(previous, sample, now, enabled) {
  const same = previous?.videoId === sample.videoId, old = same ? previous : null;
  const live = sample.isLive === true;
  const valid = Number.isFinite(sample.liveEdge) && Number.isFinite(sample.time) && sample.liveEdge > 0 && sample.time >= 0;
  const reload = valid && enabled && live && sample.atLiveHead !== true && [1, 3].includes(sample.state) && sample.liveEdge - sample.time > 15 && now - (old?.lastSync ?? 0) >= 30000;
  return { ...sample, at: now, live, lastSync: reload ? now : old?.lastSync ?? 0, reload };
}
function planSideTile(layout, rects, cols, id, anchor) {
  const { grid, boxes } = parseLayout(layout), b = boxes[anchor], height = rects[anchor] ?? { y0: 0, y1: 1 }, share = 0.18;
  if ([...id].length !== 1 || id === "." || boxes[id]) throw new Error("追加タブの名前が重複しています");
  const next = grid.map((row, r) => row.join("") + (!b || r >= b.r0 && r <= b.r1 ? id : ".")).join("\n");
  const nextRects = Object.fromEntries(Object.keys(boxes).map(key => [key, { ...rects[key], x0: rects[key].x0 * (1 - share), x1: rects[key].x1 * (1 - share) }]));
  nextRects[id] = { x0: 1 - share, x1: 1, y0: height.y0, y1: height.y1 };
  return { layout: next, rects: nextRects, cols: [...cols, cols.reduce((a, v) => a + v, 0) * share / (1 - share)] };
}
function resizeBoundary(rects, id, axis, dimension, minSize = 80) {
  const low = axis === "x" ? "x0" : "y0", high = axis === "x" ? "x1" : "y1";
  const near = axis === "x" ? "y0" : "x0", far = axis === "x" ? "y1" : "x1", edge = rects[id][high], eps = 1e-6;
  const overlap = (a, b) => Math.min(a[far], b[far]) - Math.max(a[near], b[near]) > eps;
  const before = new Set([id]), after = new Set();
  let changed;
  do {
    const count = before.size + after.size;
    for (const [key, r] of Object.entries(rects)) {
      if (Math.abs(r[low] - edge) < eps && [...before].some(k => overlap(r, rects[k]))) after.add(key);
      if (Math.abs(r[high] - edge) < eps && [...after].some(k => overlap(r, rects[k]))) before.add(key);
    }
    changed = count !== before.size + after.size;
  } while (changed);
  const left = Math.max(...[...before].map(k => rects[k][low]));
  const right = after.size ? Math.min(...[...after].map(k => rects[k][high])) : Math.min(1,
    ...Object.entries(rects).filter(([key, r]) => key !== id && r[low] >= edge - eps && overlap(r, rects[id])).map(([, r]) => r[low]));
  const minimum = Math.min(minSize / dimension, (right - left) / 2);
  return { before: [...before], after: [...after], min: left + minimum, max: right - (after.size ? minimum : 0) };
}

const ytPlayers = new Map(), ytVideoIds = new Map();
let ytApiLoading;
function loadYouTubeAPI() {
  if (window.YT?.Player) return Promise.resolve(window.YT);
  if (ytApiLoading) return ytApiLoading;
  ytApiLoading = new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error("YouTube接続がタイムアウトしました")), 15000);
    window.onYouTubeIframeAPIReady = () => { clearTimeout(timer); resolve(window.YT); };
    const script = el("script");
    script.src = "https://www.youtube.com/iframe_api";
    script.onerror = () => { clearTimeout(timer); reject(new Error("YouTube接続に失敗しました")); };
    document.head.append(script);
  }).catch(error => { ytApiLoading = null; throw error; });
  return ytApiLoading;
}
function chatVideoId(t) {
  const source = st.tiles[t.src];
  return source?.type === "yt" ? ytVideoIds.get(t.src) || parseYT(source.src)?.vid : parseYT(t.src)?.vid;
}
function refreshChats(sourceId) {
  for (const id of Object.keys(cur.boxes)) {
    const t = st.tiles[id];
    if (t?.type === "chat" && t.src === sourceId && tileEls[id]?.querySelector("iframe")?.dataset.videoId !== chatVideoId(t)) fillTile(id);
  }
}
function syncLivePlayer(id) {
  const entry = ytPlayers.get(id), t = st.tiles[id];
  if (!entry?.ready || t?.type !== "yt") return;
  const player = entry.player, videoId = parseYT(player.getVideoUrl())?.vid;
  if (!videoId) return;
  if (videoId && ytVideoIds.get(id) !== videoId) { ytVideoIds.set(id, videoId); refreshChats(id); }
  // shortcut: YouTube内部のライブ情報を利用、情報形式が変わったらこの取得部分を更新する
  const progress = player.playerInfo?.progressState;
  entry.sample = liveCorrection(entry.sample, {
    videoId, time: player.getCurrentTime(), state: player.getPlayerState(),
    liveEdge: progress?.seekableEnd, atLiveHead: progress?.isAtLiveHead,
    isLive: player.getVideoData?.()?.isLive,
  }, Date.now(), t.liveSync !== false);
  if (entry.sample.reload) player.loadVideoById(videoId);
}
function watchYouTube(id, cell, frame) {
  loadYouTubeAPI().then(YT => {
    if (!frame.isConnected || tileEls[id] !== cell) return;
    const entry = { ready: false, player: null, sample: null };
    ytPlayers.set(id, entry);
    entry.player = new YT.Player(frame, { events: {
      onReady: event => { entry.player = event.target; entry.ready = true; syncLivePlayer(id); },
      onStateChange: event => { if (event.data === 1) syncLivePlayer(id); },
    } });
  }).catch(error => {
    if (frame.isConnected) {
      const note = Array.from($("tiles").querySelectorAll("[data-live-note]")).find(n => n.dataset.liveNote === id);
      if (note) note.textContent = "自動補正に接続できません。プレイヤーの「ライブ」で手動補正してください。";
      console.warn(error);
    }
  });
}
function tileNotice(cell, message, buttonText, action) {
  cell.classList.add("off");
  const p = el("p");
  p.textContent = message;
  cell.append(p);
  if (action) {
    const button = el("button");
    button.type = "button";
    button.textContent = buttonText;
    button.onclick = action;
    cell.append(button);
  }
}

// --- タブの中身を入れる（セルが画面に入ってから呼ぶこと: TradingViewのscriptはその時に実行される） ---
function fillTile(id) {
  const cell = tileEls[id], t = tileCfg(id);
  ytPlayers.get(id)?.player?.destroy();
  ytPlayers.delete(id);
  ytVideoIds.delete(id);
  cell.replaceChildren();
  cell.classList.remove("tradingview-widget-container", "off");
  cell.style.backgroundImage = "";
  if (t.type === "chart") {
    const host = el("div", "tradingview-widget-container");
    host.innerHTML = '<div class="tradingview-widget-container__widget"></div>';
    const s = el("script");
    s.src = "https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
    s.async = true;
    const o = chartOpts(t);
    s.textContent = JSON.stringify({
      autosize: true, symbol: t.src || SYMBOLS[0], interval: o.interval, timezone: "Asia/Tokyo", theme: "dark",
      style: o.style, locale: "ja", hide_side_toolbar: true, allow_symbol_change: true, save_image: false,
      studies: o.studies, hide_volume: !o.volume,
    });
    host.append(s);
    return cell.append(host);
  }
  if (t.type === "chat") {
    const vid = chatVideoId(t);
    if (!vid) return tileNotice(cell, "YouTubeタブ名（例：A）または配信の動画URLを指定してください。チャンネル指定の場合は配信の読み込みを待ってください。");
    if (location.protocol === "file:") return tileNotice(cell, "コメント欄は公開ページまたはstart.batで起動したページで表示できます。");
    const url = new URL("https://www.youtube.com/live_chat");
    url.search = new URLSearchParams({ v: vid, embed_domain: location.hostname, dark_theme: "1" }).toString();
    const frame = el("iframe");
    frame.src = url.href;
    frame.title = "YouTubeライブチャット";
    frame.dataset.videoId = vid;
    return cell.append(frame);
  }
  const y = parseYT(t.src);
  if (!y) return tileNotice(cell, "「レイアウト編集」で有効なYouTubeの動画URL・動画ID・チャンネルIDを入力してください。");
  if (location.protocol !== "file:") { // http(s)で開いたときはそのまま埋め込める
    const f = el("iframe", "yt");
    const src = new URL(y.embed);
    src.searchParams.set("origin", location.origin);
    Object.assign(f, { src: src.href, title: "YouTube", allow: "autoplay; encrypted-media; picture-in-picture; fullscreen", allowFullscreen: true });
    cell.append(f);
    watchYouTube(id, cell, f);
    return;
  }
  // YouTubeはReferer無しの埋め込みを拒否する(エラー153)。file://はRefererを送れないので別ウィンドウで開く
  if (y.thumb) cell.style.backgroundImage = `linear-gradient(#000a,#000a),url(${y.thumb})`;
  tileNotice(cell, "ローカルファイルでは埋め込めません（YouTubeエラー153）", "▶ 別ウィンドウで開く",
    () => window.open(y.watch, "yt-" + id, "popup,width=960,height=560,noopener"));
}

// --- サイズ: 通常ドラッグはタイル単位、Shift+ドラッグは従来の行・列単位 ---
function rectsFromTracks() {
  const x = [0], y = [0], cw = st.cols.reduce((a, b) => a + b, 0), rh = st.rows.reduce((a, b) => a + b, 0);
  for (const size of st.cols) x.push(x[x.length - 1] + size / cw);
  for (const size of st.rows) y.push(y[y.length - 1] + size / rh);
  x[x.length - 1] = y[y.length - 1] = 1;
  return Object.fromEntries(Object.entries(cur.boxes).map(([id, b]) => [id, {
    x0: x[b.c0], x1: x[b.c1 + 1], y0: y[b.r0], y1: y[b.r1 + 1],
  }]));
}
function validRects() {
  return st.rectLayout === st.layout && st.rects && Object.keys(cur.boxes).every(id => {
    const r = st.rects[id];
    return r && [r.x0, r.x1, r.y0, r.y1].every(Number.isFinite) &&
      r.x0 >= 0 && r.y0 >= 0 && r.x1 <= 1 && r.y1 <= 1 && r.x1 > r.x0 && r.y1 > r.y0;
  });
}
function ensureRects() {
  if (!validRects()) { st.rects = rectsFromTracks(); st.rectLayout = st.layout; }
}
const pct = n => `${n * 100}%`;
function applyRects() {
  for (const [id, r] of Object.entries(st.rects)) {
    const cell = tileEls[id];
    if (cell) Object.assign(cell.style, {
      left: `calc(${pct(r.x0)} + ${r.x0 > 1e-6 ? 3 : 0}px)`, right: `calc(${pct(1 - r.x1)} + ${r.x1 < 1 - 1e-6 ? 3 : 0}px)`,
      top: `calc(${pct(r.y0)} + ${r.y0 > 1e-6 ? 3 : 0}px)`, bottom: `calc(${pct(1 - r.y1)} + ${r.y1 < 1 - 1e-6 ? 3 : 0}px)`,
    });
  }
  for (const { element, id, axis } of splitEls) {
    const r = st.rects[id];
    if (axis === "x") Object.assign(element.style, { left: pct(r.x1), top: pct(r.y0), bottom: pct(1 - r.y1) });
    else Object.assign(element.style, { top: pct(r.y1), left: pct(r.x0), right: pct(1 - r.x1) });
  }
}
function applySizes() {
  st.rects = rectsFromTracks();
  st.rectLayout = st.layout;
  applyRects();
}
function splitter(id, axis, line) {
  const s = el("div", "split " + axis);
  splitEls.push({ element: s, id, axis });
  s.onpointerdown = e => {
    const pos = axis === "x" ? "clientX" : "clientY", dimension = axis === "x" ? canvas.clientWidth : canvas.clientHeight;
    if (!dimension) return;
    if (e.shiftKey) {
      const arr = axis === "x" ? st.cols : st.rows, i = line - 1;
      if (i < 0 || i >= arr.length - 1) return;
      const usable = dimension, sum = arr.reduce((a, b) => a + b, 0);
      if (usable <= 0) return;
      const pa = usable * arr[i] / sum, pb = usable * arr[i + 1] / sum, total = arr[i] + arr[i + 1];
      const edge = axis === "x" ? st.rects[id].x1 : st.rects[id].y1;
      const globalEdge = usable * arr.slice(0, line).reduce((a, b) => a + b, 0) / sum;
      const start = e[pos] - (edge * usable - globalEdge);
      s.onpointermove = m => {
        arr[i] = total * dragSplit(pa, pb, m[pos] - start) / (pa + pb);
        arr[i + 1] = total - arr[i];
        applySizes();
      };
    } else {
      const r = st.rects[id], low = axis === "x" ? "x0" : "y0", high = axis === "x" ? "x1" : "y1";
      const boundary = resizeBoundary(st.rects, id, axis, dimension, MIN), start = e[pos], edge = r[high];
      if (boundary.max < boundary.min) return;
      s.onpointermove = m => {
        const next = Math.min(boundary.max, Math.max(boundary.min, edge + (m[pos] - start) / dimension));
        for (const n of boundary.before) st.rects[n][high] = next;
        for (const n of boundary.after) st.rects[n][low] = next;
        applyRects();
      };
    }
    e.preventDefault();
    s.setPointerCapture(e.pointerId);
    s.classList.add("on");
    document.body.classList.add("dragging");
    document.body.style.cursor = getComputedStyle(s).cursor;
    s.onpointerup = s.onpointercancel = () => {
      s.onpointermove = null;
      s.classList.remove("on");
      document.body.classList.remove("dragging");
      document.body.style.cursor = "";
      save();
    };
  };
  canvas.append(s);
}

// --- 組み立て ---
function render() {
  cur = parseLayout(st.layout);
  const { grid, boxes } = cur, h = grid.length, w = grid[0].length;
  if (!okArr(st.rows, h) || !okArr(st.cols, w)) { st.rows = Array(h).fill(1); st.cols = Array(w).fill(1); }
  ensureRects();
  for (const entry of ytPlayers.values()) entry.player?.destroy();
  ytPlayers.clear();
  ytVideoIds.clear();
  canvas.replaceChildren();
  tileEls = {};
  splitEls = [];
  for (const [id, b] of Object.entries(boxes)) {
    const cell = el("div", "tile");
    cell.dataset.id = id;
    canvas.append(cell);
    tileEls[id] = cell;
    fillTile(id);
  }
  for (const [id, b] of Object.entries(boxes)) {
    const r = st.rects[id];
    if (r.x1 < 1 - 1e-6) splitter(id, "x", b.c1 + 1);
    if (r.y1 < 1 - 1e-6 || st.tiles[id]?.added) splitter(id, "y", b.r1 + 1);
  }
  applyRects();
  renderTileList();
  renderSoloBar();
  save();
}

// --- 1枚だけ画面いっぱいに表示（一時的なので保存しない） ---
let solo = null;
function setSolo(id) {
  solo = tileEls[id] ? id : null;
  wall.classList.toggle("solo", !!solo);
  for (const [k, c] of Object.entries(tileEls)) c.classList.toggle("max", k === solo);
  for (const b of $("solo").children) b.classList.toggle("on", b.textContent === solo);
  $("back").disabled = !solo;
}
function renderSoloBar() {
  $("solo").replaceChildren(...Object.keys(cur.boxes).map(id => {
    const b = el("button");
    b.type = "button";
    b.textContent = id;
    b.onmouseenter = () => { const t = st.tiles[id]; b.title = `${TILE_TYPES.find(([type]) => type === t?.type)?.[1] ?? ""}: ${t?.src ?? ""}`; };
    b.onclick = () => setSolo(solo === id ? null : id);
    return b;
  }));
  setSolo(null);
}

function renderTileList() {
  $("tiles").replaceChildren(...Object.keys(cur.boxes).map(tileRow));
  renderAddAnchors();
}
function renderAddAnchors() {
  const select = $("add-anchor"), old = select.value, hadOptions = select.options.length > 0;
  const ids = Object.keys(cur.boxes).filter(id => st.tiles[id]?.type === "yt");
  select.replaceChildren(...ids.map(id => new Option(`YouTube ${id}と同じ高さ`, id)), new Option("画面全体", ""));
  select.value = hadOptions && Array.from(select.options).some(o => o.value === old) ? old : ids[0] ?? "";
}
function addChatTile() {
  if ($("layout").value.trim() && $("layout").value.trim() !== st.layout) {
    $("err").textContent = "編集中の配置を先に「適用」してください。";
    return;
  }
  const id = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"].find(key => !cur.boxes[key] && !st.tiles[key]);
  if (!id) { $("err").textContent = "追加できるタブ名がありません。"; return; }
  const anchor = $("add-anchor").value, source = Object.keys(cur.boxes).find(key => st.tiles[key]?.type === "yt");
  const plan = planSideTile(st.layout, st.rects, st.cols, id, anchor);
  st.tiles[id] = { type: "chat", src: anchor || source || "", added: true };
  st.layout = st.rectLayout = plan.layout;
  st.rects = plan.rects;
  st.cols = plan.cols;
  $("layout").value = st.layout;
  $("err").textContent = "";
  render();
}

function tileRow(id) {
  const t = tileCfg(id), row = el("div", "trow"), b = el("b"), type = el("select"), inp = el("input");
  const changed = () => { save(); fillTile(id); refreshChats(id); };
  b.textContent = id;
  for (const [value, label] of TILE_TYPES) type.add(new Option(label, value));
  type.setAttribute("aria-label", `${id}の種類`);
  inp.setAttribute("aria-label", `${id}のURL・銘柄・参照タブ`);
  type.value = t.type;
  type.onchange = () => {
    t.type = type.value;
    t.src = t.type === "yt" ? (YOUTUBE[0] ?? "") : t.type === "chat" ?
      Object.keys(cur.boxes).find(key => st.tiles[key]?.type === "yt") ?? "" : freeSymbol();
    changed();
    row.replaceWith(tileRow(id));
    renderAddAnchors();
  };
  inp.value = t.src;
  inp.onchange = () => { t.src = inp.value.trim(); changed(); };
  row.append(b, type, inp);
  if (t.type !== "chart") {
    row.classList.add("media");
    const note = el("p", "media-note");
    if (t.type === "yt") {
      inp.placeholder = "URL / 動画ID / チャンネルID(UC…)";
      const label = el("label"), check = el("input");
      check.type = "checkbox";
      check.checked = t.liveSync !== false;
      check.onchange = () => { t.liveSync = check.checked; save(); syncLivePlayer(id); };
      label.append(check, "ライブの遅延を自動補正");
      row.append(label);
      note.dataset.liveNote = id;
      note.textContent = "再生中のライブが15秒以上遅れたら最新位置へ読み直します。過去を見るときはチェックを外してください。手動停止は維持します。";
    } else {
      inp.placeholder = "YouTubeタブ名（Aなど） / 配信の動画URL";
      note.textContent = "YouTubeタブ名を指定すると、そのタブの配信変更に連動します。ライブチャットが有効な配信で表示できます。";
    }
    row.append(note);
    return row;
  }
  inp.placeholder = "銘柄 例: FX:USDJPY";
  const o = chartOpts(t);
  const pick = (list, key) => {
    const sel = el("select");
    for (const [v, label] of list) sel.add(new Option(label, v));
    sel.value = o[key];
    sel.onchange = () => { t[key] = sel.value; changed(); };
    return sel;
  };
  const check = (label, on, set) => {
    const l = el("label"), c = el("input");
    c.type = "checkbox";
    c.checked = on;
    c.onchange = () => { set(c.checked); changed(); };
    l.append(c, label);
    return l;
  };
  const det = el("details"), sum = el("summary"), box = el("div");
  const count = () => sum.textContent = `インジケーター（${chartOpts(t).studies.length}）`;
  box.append(
    check("出来高", o.volume, v => t.volume = v),
    ...STUDIES.map(([sid, label]) => check(label, o.studies.includes(sid), v => {
      t.studies = chartOpts(t).studies.filter(x => x !== sid).concat(v ? [sid] : []);
      count();
    })),
  );
  count();
  det.append(sum, box);
  row.append(pick(INTERVALS, "interval"), pick(STYLES, "style"), det);
  return row;
}

function apply() {
  const text = $("layout").value.trim();
  try { parseLayout(text); } catch (e) { $("err").textContent = e.message; return; }
  $("err").textContent = "";
  if (text !== st.layout) { st.rects = null; st.rectLayout = null; }
  $("layout").value = st.layout = text;
  render();
}

for (const [name] of PRESETS) $("preset").add(new Option(name));
$("preset").onchange = e => {
  const p = PRESETS[e.target.selectedIndex - 1];
  e.target.selectedIndex = 0;
  if (p) { $("layout").value = p[1]; apply(); }
};
$("apply").onclick = apply;
$("add-chat").onclick = addChatTile;
$("edit").onclick = () => {
  const open = $("panel").hidden;
  $("panel").hidden = !open;
  document.body.classList.toggle("editing", open);
  if (open) { $("layout").value = st.layout; $("err").textContent = ""; }
};
$("back").onclick = () => setSolo(null);
$("reset").onclick = () => { st.rows.fill(1); st.cols.fill(1); applySizes(); save(); };

render();
setInterval(() => { for (const id of ytPlayers.keys()) syncLivePlayer(id); }, 10000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) for (const id of ytPlayers.keys()) syncLivePlayer(id); });
</script>
